[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal-dedupe"
version = "0.1.0"
description = "Safely remove exact duplicate tracks from editable TIDAL playlists"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "tidalapi==0.8.11",
  "questionary==2.1.1",
]

[project.scripts]
tidal-dedupe = "tidal_dedupe.app:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
